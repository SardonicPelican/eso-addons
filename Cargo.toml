[package]
name = "eso-addons"
version = "0.3.0"
authors = ["Damian Czaja <trojan295@protonmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "eso-addons"
path = "src/main.rs"

[lib]

[dependencies]
toml = "1.1.4"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1"
clap = { version = "4.6.5", features = ["derive", "cargo"] }
dirs = "6.0"
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
zip = "8.6"
scraper = "0.27"
tempfile = "3.27"
requestty = "0.6"
colored = "3"
prettytable-rs = "^0.10"
